version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: toka-db
    environment:
      POSTGRES_USER: toka
      POSTGRES_PASSWORD: toka
      POSTGRES_DB: toka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toka"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  pgdata:

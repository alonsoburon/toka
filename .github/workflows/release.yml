name: Release

# Publica un APK firmado como GitHub Release. Obtainium (y cualquier otro cliente que
# mire releases) lo detecta por el asset .apk.
#
# Disparo normal: empujar un tag vX.Y.Z.  También se puede lanzar a mano desde la
# pestaña Actions indicando la versión.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar, sin la v (p. ej. 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolver versión
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          {
            echo "name=$VERSION"
            echo "code=$CODE"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma y build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decodificar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK de release
        working-directory: android
        env:
          TOKA_KEYSTORE: ${{ runner.temp }}/release.jks
          TOKA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TOKA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TOKA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PtokaVersionName="${{ steps.version.outputs.name }}" \
            -PtokaVersionCode="${{ steps.version.outputs.code }}"

      - name: Preparar asset
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             "toka-${{ steps.version.outputs.name }}.apk"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "toka-${{ steps.version.outputs.name }}.apk" \
            --title "Toka ${{ steps.version.outputs.name }}" \
            --generate-notes
